<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exquisite Counseling Services – Employment</title>
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Calendly CSS (if you still need it) -->
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    
    :root {
      --primary-color: #FFD700;
      --secondary-color: #FFA500;
      --text-dark: #FFD700;
      --text-light: #E6C200;
      --bg-dark: #0a0a0a;
      --bg-card: #1a1a1a;
      --border-color: #333333;
    }
    
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    header {
      background: var(--bg-card);
      padding: 1.5rem 2rem;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 2px solid var(--primary-color);
      overflow: hidden;
    }
    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 215, 0, 0.4) 50%, transparent 70%);
      transform: skewX(-30deg);
      animation: shimmer 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%) skewX(-30deg); }
      100% { transform: translateX(100%) skewX(-30deg); }
    }
    .logo {
      max-width: 120px;
      height: auto;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
      display: inline-block;
    }
    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }
    nav ul li {
      margin: 0;
    }
    nav ul li a {
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }
    nav ul li a:hover {
      background: var(--primary-color);
      color: #000;
    }
    .container {
      width: 90%;
      max-width: 600px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--text-dark);
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
    }
    label {
      display: block;
      margin-top: 1.25rem;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      background: var(--bg-dark);
      color: var(--primary-color);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    button {
      margin-top: 2rem;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(255,215,0,0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,215,0,0.5);
    }
    #status {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      padding: 2rem;
      background: var(--bg-card);
      border-top: 2px solid var(--primary-color);
    }
    footer p {
      color: var(--text-light);
      margin: 0.5rem 0;
    }
    footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    footer a:hover {
      color: var(--secondary-color);
    }
  </style>

  <!-- EmailJS SDK (match your version exactly) -->
  <script type="text/javascript" src="https://cdn.emailjs.com/sdk/2.3.2/email.min.js"></script>
  <script>
    (function(){
      // ─── REPLACE with your EmailJS User ID exactly ───
      emailjs.init("CRY9t7KxoT1lJ5RjG");
      console.log("EmailJS initialized: CRY9t7KxoT1lJ5RjG");
    })();
  </script>
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="employment.html">Employment</a></li>
        <li><a href="referral.html">Referrals</a></li>
      </ul>
    </nav>
    <img class="logo" src="Official Logo.png" alt="Exquisite Counseling Services Logo" />
  </header>

  <div class="container">
    <h2>Employment Inquiry</h2>
    <form id="employment-form" enctype="multipart/form-data">
      <!-- Full Name -->
      <label for="user_name">Full Name</label>
      <input type="text" id="user_name" name="user_name" placeholder="Your name" required />

      <!-- Contact Email -->
      <label for="user_email">Contact Email</label>
      <input type="email" id="user_email" name="user_email" placeholder="you@example.com" required />

      <!-- Hidden field for To-Email -->
      <input type="hidden" id="email" name="email" />

      <!-- Phone Number -->
      <label for="user_phone">Phone Number</label>
      <input type="tel" id="user_phone" name="user_phone" placeholder="(123) 456-7890" required />

      <!-- PDF Upload -->
      <label for="attachment">Upload Your PDF (Resume / Document)</label>
      <input type="file" id="attachment" name="attachment" accept="application/pdf" required />

      <button type="submit">Submit &amp; Receive Info PDF</button>
    </form>
    <div id="status"></div>
  </div>

  <footer>
    <p>© 2026 Exquisite Counseling Services</p>
    <p>
      4410 Claiborne Sq. E., Ste. 343, Hampton, VA 23666 |
      <a href="tel:+17579698584">(757) 969-8584</a> |
      Fax: (757) 826-4681 |
      <a href="mailto:exquisitecounseling@aol.com">exquisitecounseling@aol.com</a>
    </p>
    <p>
    <a href="https://www.instagram.com/exquisitecounseling/?utm_source=ig_embed&utm_campaign=loading" 
       target="_blank" 
       style="color: #FFD700; text-decoration: none; font-weight: bold; font-size: 1.1rem; margin-right: 20px;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" 
           alt="Instagram" 
           style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
      Follow us on Instagram
    </a>
    <a href="https://www.facebook.com/profile.php?id=61576741722580" 
       target="_blank" 
       style="color: #FFD700; text-decoration: none; font-weight: bold; font-size: 1.1rem;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg" 
           alt="Facebook" 
           style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
      Follow us on Facebook
    </a>
  </p>
</footer>

  <script>
    document.getElementById('employment-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const statusEl = document.getElementById('status');

      // Copy “Contact Email” into the hidden “email” field for the template’s {{email}}
      const userEmailValue = this.user_email.value.trim();
      document.getElementById('email').value = userEmailValue;

      // Log form values to console for debugging
      console.log("Form Values:", {
        user_name: this.user_name.value,
        email: this.email.value,
        user_phone: this.user_phone.value,
        attachment: this.attachment.files[0]
      });

      // ─── UPDATE these to match your EmailJS account ───
      const SERVICE_ID  = 'service_n4dsmim';
      const TEMPLATE_ID = 'template_4ktrtz5';

      // Send the form; EmailJS will include the <input name="attachment"> as a PDF
      emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, this)
        .then(response => {
          console.log('EmailJS success:', response.status, response.text);
          statusEl.style.color = 'lightgreen';
          statusEl.textContent = '✅ Email and PDF sent successfully!';
          this.reset();
        })
        .catch(error => {
          console.error('EmailJS error:', error);
          statusEl.style.color = 'salmon';
          statusEl.innerHTML = `
            ❌ Failed to send. Check console for details.<br>
            <em>Error: ${error.text || JSON.stringify(error)}</em>
          `;
        });
    });
  </script>
</body>
</html>
