<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exquisite Counseling Services – Referrals</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

    :root {
      --primary-color: #FFD700;
      --secondary-color: #FFA500;
      --text-dark: #FFD700;
      --text-light: #E6C200;
      --bg-dark: #0a0a0a;
      --bg-card: #1a1a1a;
      --border-color: #333333;
    }
    
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    header {
      background: var(--bg-card);
      padding: 1.5rem 2rem;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 2px solid var(--primary-color);
      overflow: hidden;
    }
    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 215, 0, 0.4) 50%, transparent 70%);
      transform: skewX(-30deg);
      animation: shimmer 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%) skewX(-30deg); }
      100% { transform: translateX(100%) skewX(-30deg); }
    }
    .logo { 
      max-width: 120px; 
      height: auto; 
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
      display: inline-block;
    }
    nav ul { 
      list-style: none; 
      margin: 0; 
      padding: 0; 
      display: flex; 
      justify-content: center;
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }
    nav ul li { margin: 0; }
    nav ul li a {
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }
    nav ul li a:hover { 
      background: var(--primary-color);
      color: #000; 
    }

    .container { width: 90%; max-width: 600px; margin: 3rem auto; }
    section {
      background: var(--bg-card);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
    }
    h2 { 
      text-align: center; 
      margin-bottom: 1.5rem;
      color: var(--text-dark);
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
    }
    label {
      display: block;
      margin: 1.25rem 0 0.5rem;
      color: var(--text-dark);
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-dark);
      color: var(--primary-color);
      font-family: 'Inter', sans-serif;
      resize: vertical;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    button {
      display: block;
      width: 100%;
      margin-top: 2rem;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #000;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(255,215,0,0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,215,0,0.5);
    }
    #status {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }
    footer {
      background: var(--bg-card);
      padding: 2rem;
      border-top: 2px solid var(--primary-color);
      margin-top: 3rem;
    }
    footer p {
      color: var(--text-light);
      margin: 0.5rem 0;
    }
    footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    footer a:hover {
      color: var(--secondary-color);
    }
  </style>

  <!-- EmailJS SDK (keep your user ID here) -->
  <script type="text/javascript" src="https://cdn.emailjs.com/sdk/2.3.2/email.min.js"></script>
  <script>
    (function() {
      emailjs.init("CRY9t7KxoT1lJ5RjG"); // your EmailJS user ID
    })();
  </script>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="employment.html">Employment</a></li>
        <li><a href="referral.html">Referrals</a></li>
      </ul>
    </nav>
    <img class="logo" src="Official Logo.png" alt="Exquisite Counseling Services Logo" />
  </header>

  <div class="container">
    <section>
      <h2>Refer a Client to Exquisite Counseling Services</h2>
      <form id="referral-form">
        <!-- Name -->
        <label for="user_name">
          Name<br>
          <input type="text" id="user_name" name="user_name" placeholder="Full Name" required>
        </label>

        <!-- Age -->
        <label for="user_age">
          Age<br>
          <input type="number" id="user_age" name="user_age" min="0" placeholder="e.g., 35" required>
        </label>

        <!-- Contact Email -->
        <label for="user_email">
          Contact Email<br>
          <input type="email" id="user_email" name="user_email" placeholder="you@example.com" required>
        </label>

        <!-- Hidden “email” field to satisfy your template’s {{email}} placeholder -->
        <input type="hidden" id="email" name="email" />

        <!-- Primary Number -->
        <label for="user_phone">
          Primary Number<br>
          <input type="tel" id="user_phone" name="user_phone" placeholder="(123) 456-7890" required>
        </label>

        <!-- Concern -->
        <label for="user_concern">
          Concern<br>
          <textarea id="user_concern" name="user_concern" rows="3" placeholder="Briefly describe the primary concern" required></textarea>
        </label>

        <button type="submit">Submit Referral</button>
      </form>

      <div id="status"></div>
    </section>
  </div>

  <footer style="text-align:center; padding:20px;">
    <p>© 2026 Exquisite Counseling Services</p>
    <p>4410 Claiborne Sq. E., Ste. 343, Hampton, VA 23666 | 
       <a href="tel:+17579698584" style="color:#FFD700;">(757) 969-8584</a>
    </p>
<p>
    <a href="https://www.instagram.com/exquisitecounseling/?utm_source=ig_embed&utm_campaign=loading" 
       target="_blank" 
       style="color: #FFD700; text-decoration: none; font-weight: bold; font-size: 1.1rem; margin-right: 20px;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" 
           alt="Instagram" 
           style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
      Follow us on Instagram
    </a>
    <a href="https://www.facebook.com/profile.php?id=61576741722580" 
       target="_blank" 
       style="color: #FFD700; text-decoration: none; font-weight: bold; font-size: 1.1rem;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg" 
           alt="Facebook" 
           style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
      Follow us on Facebook
    </a>
  </p>
</footer>

  <script>
    document.getElementById('referral-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const statusEl = document.getElementById('status');

      // Copy the “Contact Email” value into the hidden <input name="email"> before sending:
      document.getElementById('email').value = document.getElementById('user_email').value;

      // Now send the form to EmailJS (be sure that your Service ID & Template ID match):
      emailjs.sendForm('service_n4dsmim', 'template_q3325mh', this)
        .then(() => {
          statusEl.style.color = 'lightgreen';
          statusEl.textContent = '✅ Referral sent successfully!';
          this.reset();
        }, (err) => {
          statusEl.style.color = 'salmon';
          statusEl.textContent = '❌ Oops, something went wrong. Please try again.';
          console.error('EmailJS error:', err);
        });
    });
  </script>
</body>
</html>
